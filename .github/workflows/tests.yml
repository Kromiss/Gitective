# Tests on Windows for every pull request into develop or main; failures shown as annotations.
name: Tests

on:
  pull_request:
    branches: [develop, main]

jobs:
  tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tests
        run: |
          python -m unittest discover -s tests -t . > test.log 2>&1 && exit 0
          cat test.log
          echo "::error title=Tests failed::$(grep -A25 -E '^(FAIL|ERROR):' test.log | head -150 | sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g')"
          exit 1

# On every push to main: tests, then the admin and user editions (.exe and source .zip)
# published as a GitHub release tagged with the date and a counter, e.g. 2026.10.29-1.
# Pull requests into develop or main run the same tests and builds, without publishing.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Build tools only: the application itself keeps to the standard library (CT-02).
      - name: Install build tools
        run: python -m pip install pyinstaller tzdata

      - name: Tests
        run: tools/annotate.sh "Tests" python -m unittest discover -s tests -t .

      - name: Release number
        id: number
        run: |
          day=$(python -c "from datetime import datetime; from zoneinfo import ZoneInfo; print(datetime.now(ZoneInfo('Europe/Paris')).strftime('%Y.%m.%d'))")
          last=$(git ls-remote --tags origin "refs/tags/$day-*" | sed 's/.*-//' | sort -n | tail -1)
          echo "tag=$day-$(( ${last:-0} + 1 ))" >> "$GITHUB_OUTPUT"
          echo "version=$(python -c 'import gitective; print(gitective.__version__)')" >> "$GITHUB_OUTPUT"

      - name: Build editions
        env:
          TAG: ${{ steps.number.outputs.tag }}
        run: |
          mkdir -p dist
          for edition in admin user; do
            name="Gitective-$edition"
            python tools/make_edition.py "$edition" "build/$name" --build "$TAG"
            tools/annotate.sh "Tests $edition" bash -c "cd build/$name && python -m unittest discover -s tests -t ."
            python -c "import shutil; shutil.make_archive('dist/$name', 'zip', 'build', '$name')"
            tools/annotate.sh "PyInstaller $edition" pyinstaller --noconfirm --onefile --windowed --name "$name" \
              --icon "build/$name/gitective/assets/logo.ico" \
              --add-data "build/$name/gitective/assets;gitective/assets" \
              --paths "build/$name" --distpath dist --workpath "work/$edition" \
              "build/$name/main.pyw"
          done
          ls -l dist

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.number.outputs.tag }}
          VERSION: ${{ steps.number.outputs.version }}
        run: |
          gh release create "$TAG" dist/*.exe dist/*.zip --target "$GITHUB_SHA" \
            --title "Gitective $VERSION ($TAG)" --generate-notes
